<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Mak Nyus - Menu & Pemesanan</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Tambahan CSS inline jika diperlukan */
    </style>
</head>
<body>
    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Warung Mak Nyus</h1>
            <p>Rasa Bintang Lima, Harga Kaki Lima</p>
            <a href="#menu" class="btn-primary">Lihat Menu</a>
        </div>
    </header>

    <!-- Navigation Filter -->
    <nav class="filter-nav" id="menu">
        <div class="container">
            <div class="filter-tabs">
                <button class="tab-btn active" data-category="semua">Semua</button>
                <button class="tab-btn" data-category="makanan">Makanan</button>
                <button class="tab-btn" data-category="minuman">Minuman</button>
                <button class="tab-btn" data-category="snack">Snack</button>
            </div>
        </div>
    </nav>

    <!-- Menu Section -->
    <section class="menu-section">
        <div class="container">
            <div id="menu-grid" class="menu-grid">
                <!-- Menu items will be injected by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Cart Overlay/Panel -->
    <div id="cart-panel" class="cart-panel">
        <div class="cart-header">
            <h3>Keranjang Belanja</h3>
            <button id="close-cart" class="close-btn"><i data-lucide="x"></i></button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Cart items will be injected by JavaScript -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">Rp 0</span>
            </div>
            <div class="cart-actions">
                <button id="clear-cart" class="btn-outline">Kosongkan</button>
                <button id="checkout-wa" class="btn-checkout">
                    <i data-lucide="message-circle"></i> Pesan via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Floating Cart Button (Visible when cart has items) -->
    <button id="floating-cart" class="floating-cart">
        <i data-lucide="shopping-cart"></i>
        <span id="cart-count">0</span>
    </button>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Item ditambahkan!</div>

    <footer class="footer">
        <p>&copy; 2024 Warung Mak Nyus. Semua hak dilindungi.</p>
    </footer>

    <script>
        /**
         * WARUNG MAK NYUS - SCRIPT
         */
        const menuData = [
            { id: 1, nama: "Nasi Goreng Spesial", kategori: "makanan", harga: 25000, deskripsi: "Nasi goreng dengan telur mata sapi, ayam suwir, dan kerupuk.", gambarURL: "https://images.unsplash.com/photo-1512058560566-42724afbc2db?w=500" },
            { id: 2, nama: "Ayam Bakar Madu", kategori: "makanan", harga: 30000, deskripsi: "Ayam bakar dibumbui madu spesial, disajikan dengan lalapan.", gambarURL: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=500" },
            { id: 3, nama: "Mie Goreng Jawa", kategori: "makanan", harga: 18000, deskripsi: "Mie goreng khas Jawa dengan sayuran segar dan bumbu otentik.", gambarURL: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=500" },
            { id: 4, nama: "Es Teh Manis", kategori: "minuman", harga: 5000, deskripsi: "Teh seduh segar dengan gula asli.", gambarURL: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=500" },
            { id: 5, nama: "Es Jeruk Peras", kategori: "minuman", harga: 8000, deskripsi: "Jeruk peras segar, sumber vitamin C.", gambarURL: "https://images.unsplash.com/photo-1434144893279-2a9fc14e9337?w=500" },
            { id: 6, nama: "Kopi Susu Aren", kategori: "minuman", harga: 15000, deskripsi: "Kopi robusta dengan susu dan gula aren cair.", gambarURL: "https://images.unsplash.com/photo-1559496417-e7f25cb247f3?w=500" },
            { id: 7, nama: "Pisang Goreng Keju", kategori: "snack", harga: 12000, deskripsi: "Pisang goreng kipas dengan taburan keju dan susu kental manis.", gambarURL: "https://images.unsplash.com/photo-1590333746430-e0066cf6922b?w=500" },
            { id: 8, nama: "Bakwan Sayur", kategori: "snack", harga: 10000, deskripsi: "Bakwan renyah dengan isian sayur (3 pcs).", gambarURL: "https://images.unsplash.com/photo-1610192244261-3f33de8f5f84?w=500" }
        ];

        let cart = [];
        const waNumber = "6281318531260";

        // DOM Elements
        const menuGrid = document.getElementById('menu-grid');
        const filterBtns = document.querySelectorAll('.tab-btn');
        const cartPanel = document.getElementById('cart-panel');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotalPriceEl = document.getElementById('cart-total-price');
        const cartCountEl = document.getElementById('cart-count');
        const floatingCartBtn = document.getElementById('floating-cart');
        const closeCartBtn = document.getElementById('close-cart');
        const clearCartBtn = document.getElementById('clear-cart');
        const checkoutWaBtn = document.getElementById('checkout-wa');
        const toastEl = document.getElementById('toast');

        function renderMenu(category) {
            if (!menuGrid) return;
            const filteredMenu = category === 'semua' ? menuData : menuData.filter(item => item.kategori === category);
            menuGrid.innerHTML = filteredMenu.map(item => `
                <div class="menu-card" data-id="${item.id}">
                    <img src="${item.gambarURL}" alt="${item.nama}" class="card-img" loading="lazy">
                    <div class="card-content">
                        <span class="category">${item.kategori}</span>
                        <h3>${item.nama}</h3>
                        <p class="desc">${item.deskripsi}</p>
                        <div class="card-footer">
                            <span class="price">${formatRupiah(item.harga)}</span>
                            <button class="add-btn" onclick="addToCart(${item.id})">Tambah</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = menuData.find(item => item.id === id);
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) { existingItem.quantity += 1; } 
            else { cart.push({ ...product, quantity: 1 }); }
            saveCart();
            updateCartUI();
            showToast();
        }

        function removeFromCart(id) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                if (cart[itemIndex].quantity > 1) { cart[itemIndex].quantity -= 1; } 
                else { cart.splice(itemIndex, 1); }
            }
            saveCart();
            updateCartUI();
        }

        function updateCartUI() {
            if (!cartCountEl || !cartTotalPriceEl || !cartItemsContainer) return;
            const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
            const totalPrice = cart.reduce((total, item) => total + (item.harga * item.quantity), 0);
            cartCountEl.textContent = totalItems;
            cartTotalPriceEl.textContent = formatRupiah(totalPrice);
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align:center; padding:20px; color:#999;">Keranjang kosong.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="item-info">
                            <h4>${item.nama}</h4>
                            <p>${formatRupiah(item.harga)} x ${item.quantity}</p>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="item-price">${formatRupiah(item.harga * item.quantity)}</span>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})"><i data-lucide="minus-circle" style="width:18px;"></i></button>
                            <button class="remove-btn" onclick="addToCart(${item.id})" style="color:var(--primary)"><i data-lucide="plus-circle" style="width:18px;"></i></button>
                        </div>
                    </div>
                `).join('');
                if (window.lucide) lucide.createIcons();
            }
        }

        function generateWALink() {
            if (cart.length === 0) { alert("Keranjang masih kosong!"); return; }
            const totalPrice = cart.reduce((total, item) => total + (item.harga * item.quantity), 0);
            let message = `*HALO WARUNG MAK NYUS!*\nSaya mau pesan makanan berikut:\n\n`;
            cart.forEach((item, index) => {
                message += `${index + 1}. *${item.nama}* x${item.quantity}\n   Subtotal: ${formatRupiah(item.harga * item.quantity)}\n`;
            });
            message += `\n--------------------------\n*TOTAL PEMBAYARAN: ${formatRupiah(totalPrice)}*\n--------------------------\n\nMohon segera diproses ya, terima kasih! 🙏`;
            window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function formatRupiah(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); }
        function saveCart() { localStorage.setItem('makNyusItems', JSON.stringify(cart)); }
        function loadCart() { try { const s = localStorage.getItem('makNyusItems'); if (s) cart = JSON.parse(s); } catch(e) { cart = []; } }
        function showToast() { toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 2000); }

        // Events
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMenu(btn.getAttribute('data-category'));
            });
        });
        floatingCartBtn.addEventListener('click', () => cartPanel.classList.add('active'));
        closeCartBtn.addEventListener('click', () => cartPanel.classList.remove('active'));
        clearCartBtn.addEventListener('click', () => { if (confirm("Kosongkan keranjang?")) { cart = []; saveCart(); updateCartUI(); } });
        checkoutWaBtn.addEventListener('click', generateWALink);

        // Init
        loadCart();
        renderMenu('semua');
        updateCartUI();
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
